<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dig Grid</title>
<link rel="stylesheet" href="css/dig-grid.css">
</head>
<body>

<a class="back-link" href="index.html">← Menu</a>

<h1>⛏️ Dig Grid</h1>
<div class="sub">Click a tile to dig — reveal a reward from 0–89</div>

<label class="player-select">
  Playing as
  <select id="playerSelect">
    <option value="player1">Player One</option>
    <option value="player2">Player Two</option>
    <option value="player3">Player Three</option>
  </select>
</label>

<div class="turn-bar">
  <span id="turnInfo">Turn 1 — 0/10 picks used</span>
  <button id="nextTurnBtn" class="text-btn">Next Turn</button>
</div>

<div class="stats">
  <div>Total: <span id="total">0</span></div>
  <div>Revealed: <span id="count">0</span>/81</div>
</div>

<div class="grid" id="grid"></div>

<div class="controls">
  <button id="resetBtn">Reset Grid</button>
  <button id="showAllBtn">Show All</button>
</div>

<div class="collection">
  <h2>Collection <span class="sub">— resources dug up so far</span></h2>
  <ul class="collection-list" id="collectionList"></ul>
  <div class="collection-footer">
    <span>Grand Total: <span id="collectionTotal">0</span></span>
    <button id="resetCollectionBtn" class="text-btn">Reset This Player</button>
  </div>
  <div class="collection-footer actions">
    <button id="exportBtn" class="text-btn">Export Database</button>
    <button id="importBtn" class="text-btn">Import Database</button>
    <input type="file" id="importInput" accept="application/json" hidden>
  </div>
</div>

<div class="collection">
  <h2>Turn History <span class="sub">— picks &amp; totals by turn</span></h2>
  <ul class="turn-history-list" id="turnHistoryList"></ul>
</div>

<script src="js/database.js"></script>
<script src="js/dig-grid.js"></script>

</body>
</html>
