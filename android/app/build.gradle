plugins {
    id "com.android.application"
}

android {
    namespace "com.craftyoils.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.craftyoils.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // A fixed, checked-in debug keystore (rather than the machine-local one
    // Gradle generates automatically) so every debug build — from any dev
    // machine or CI run — is signed with the same key. Without this, each
    // CI run got its own random debug key, and Android refuses to install
    // an APK over an existing install once the signature no longer matches.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
